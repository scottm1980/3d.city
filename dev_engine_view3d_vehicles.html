<!DOCTYPE html>
<html lang="en">
<head>
<title>engine real-renderer vehicles preview</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
<link rel="icon" href="favicon.ico" />
<link type="text/css" rel="stylesheet" href="index.css">
</head>
<style>
#status { position:absolute; left:10px; top:10px; z-index:10; font:12px monospace; background:rgba(0,0,0,0.6); color:#fff; padding:6px 10px; max-width:90%; }
</style>
<script type="module">
	// Seventh dev preview: ports the multi-city/vehicle work proven in
	// dev_engine_region_3d.html (a standalone Three.js scene) into the
	// REAL View.js scene instead - the actual ask after
	// dev_engine_view3d_buildings.html proved single-city terrain and
	// buildings. Still never calls Main.init()/boots a Worker/loads GPL
	// CityGame.js.
	//
	// View.js's internal state (this.land, mapSize, AppState.tilesData)
	// is fundamentally single-map-shaped - there's no "second city" slot
	// to render into without refactoring View.js itself, which this pass
	// deliberately does not attempt. Instead: two real cities are placed
	// side by side inside ONE combined tilesData grid (a gap of plain
	// ground between them stands in for the corridor), so View.js renders
	// both with its completely unmodified, real terrain/building
	// pipeline. A real 2-city RegionState (CorridorEdge, TradeResolver,
	// RegionOrchestrator - all proven Tier 1-7 code) drives an actual
	// mine-city/mill-city trade scenario, and every in-transit cross-city
	// Shipment is rendered as an InstancedMesh instance added directly to
	// view3d.scene, colored by Tier 6's cargo visuals - the same
	// mechanism verified in dev_engine_region_3d.html, now live in the
	// real renderer's own scene graph instead of a standalone one.
	import { View } from './src/city3d/View.js';
	import { Hub } from './src/city3d/Hub.js';
	import { AppState } from './src/AppState.js';
	import * as THREE from './src/three/three.module.js';

	import { CityState, ControlMode } from './src/engine/world/CityState.js';
	import { CityMapGenerator } from './src/engine/worldgen/CityMapGenerator.js';
	import { TerrainType } from './src/engine/worldgen/Terrain.js';
	import { ResourceEndowment } from './src/engine/world/ResourceEndowment.js';
	import { RegionState } from './src/engine/world/RegionState.js';
	import { CorridorEdge } from './src/engine/world/CorridorEdge.js';
	import { ZoneType } from './src/engine/world/ZoneType.js';
	import { ZoneResolver, geographicResourceIds, developLot, footprintTiles } from './src/engine/resolution/ZoneResolver.js';
	import { DefaultResourceTypes, DefaultResourceRules } from './src/engine/worldgen/DefaultResources.js';
	import { DefaultRecipes, DefaultProcessedResourceTypes } from './src/engine/resolution/DefaultRecipes.js';
	import { RegionOrchestrator } from './src/engine/orchestrator/RegionOrchestrator.js';
	import { availableResourceIds } from './src/engine/trade/TradeResolver.js';
	import { createDefaultCargoVisualRegistry } from './src/engine/visuals/DefaultCargoVisuals.js';
	import { visualForShipment, ModelVariant } from './src/engine/visuals/CargoVisual.js';
	import { ShipmentState } from './src/engine/trade/Shipment.js';

	const TILE_WATER = 2;
	const TILE_GROUND = 0;
	const TILE_TREE_BASE = 21;
	const TOOL_ID = { [ZoneType.RESIDENTIAL]: 1, [ZoneType.COMMERCIAL]: 2, [ZoneType.INDUSTRIAL]: 3 };

	const CITY_SIZE = 40;
	const GAP = 24;
	const COMBINED_W = CITY_SIZE * 2 + GAP;
	const COMBINED_H = CITY_SIZE;

	function status ( s ) { document.getElementById( 'status' ).textContent = s; }
	function treeVariant ( x, y ) { return TILE_TREE_BASE + ( ( x * 7 + y * 13 ) % 8 ); }
	function hexToThreeColor ( hex ) { return new THREE.Color( ( (hex>>16)&255 )/255, ( (hex>>8)&255 )/255, (hex&255)/255 ); }

	// --- Simulation: a real 2-city RegionState, mine city -> mill city ---

	function buildSimulation () {

		const region = new RegionState( 'preview-region', 'Preview Region' );
		for ( const rt of DefaultResourceTypes ) region.resources.register( rt );
		for ( const rt of DefaultProcessedResourceTypes ) region.resources.register( rt );
		for ( const recipe of DefaultRecipes ) region.recipes.register( recipe );

		const mineCity = new CityState( 'mine', 'Ironhaven', { width: CITY_SIZE, height: CITY_SIZE, controlMode: ControlMode.AUTOMATED, regionPosition: { x: CITY_SIZE/2, y: CITY_SIZE/2 } } );
		const millCity = new CityState( 'mill', 'Steeltown', { width: CITY_SIZE, height: CITY_SIZE, controlMode: ControlMode.MANAGED, regionPosition: { x: CITY_SIZE*2 + GAP - CITY_SIZE/2, y: CITY_SIZE/2 } } );

		new CityMapGenerator( 1 ).generate( mineCity );
		new CityMapGenerator( 2 ).generate( millCity );

		// Guarantee the mine city actually has iron_ore + coal, same
		// reliability trick as the original Tier 4 test - procedural
		// placement is real but not guaranteed to land exactly where a
		// small demo city needs it.
		mineCity.lotAt( 5, 5 ).resourceEndowment = new ResourceEndowment( 'iron_ore', 1 );
		mineCity.lotAt( 5, 5 ).terrain = TerrainType.MOUNTAIN;
		mineCity.lotAt( 10, 5 ).resourceEndowment = new ResourceEndowment( 'coal', 1 );
		mineCity.lotAt( 10, 5 ).terrain = TerrainType.HILLS;

		region.addCity( mineCity );
		region.addCity( millCity );
		region.addCorridor( new CorridorEdge( 'road1', mineCity.id, millCity.id, { distance: GAP + CITY_SIZE, capacity: 30 } ) );

		const resolver = new ZoneResolver( region.recipes, geographicResourceIds( DefaultResourceRules ) );

		// Zone the guaranteed resource lots first so the mine/coal
		// facilities exist from tick 1.
		for ( const [ lx, ly ] of [ [5,5], [10,5] ] ) {
			const lot = mineCity.lotAt( lx, ly );
			lot.zoneType = ZoneType.INDUSTRIAL;
			const recipe = resolver.resolve( mineCity, lot, new Set() );
			if ( recipe ) developLot( mineCity, lot, recipe );
		}

		const orchestrator = new RegionOrchestrator( region, { seed: 1, automatedTickInterval: 1, maxLotsPerAutomatedTick: 3 } );

		return { region, mineCity, millCity, resolver, orchestrator };

	}

	// Finds an actually-clear spot for the steel_mill test lot, rather
	// than hardcoding a position - fillCity's dense grid may have already
	// claimed footprints nearby, and footprintTiles() (the same check
	// resolve() uses) is the honest way to confirm clearance rather than
	// guessing at a gap.
	function findClearIndustrialSpot ( city ) {

		for ( const lot of city.lots ) {

			if ( lot.terrain === TerrainType.WATER || lot.isDeveloped ) continue;
			if ( footprintTiles( city, lot, 3 ) ) return lot;

		}

		return null;

	}

	// Fills the rest of each city (outside the guaranteed resource lots)
	// with a modest, dense-but-bounded R/C/I grid, reusing the proven
	// footprint-clearance mechanism - real, not synthetically spaced.
	function fillCity ( city, region, resolver, zoneCycle ) {

		const available = new Set( [ 'labor' ] );
		let cycleIndex = 0;

		for ( let y = 3; y < city.height - 3; y += 5 ) {
			for ( let x = 3; x < city.width - 3; x += 5 ) {
				const lot = city.lotAt( x, y );
				if ( ! lot || lot.terrain === TerrainType.WATER || lot.isDeveloped ) continue;
				lot.zoneType = zoneCycle[ cycleIndex % zoneCycle.length ];
				cycleIndex ++;
				const recipe = resolver.resolve( city, lot, available );
				if ( recipe ) developLot( city, lot, recipe );
			}
		}

	}

	// --- Combined tilesData: two real cities side by side, one grid ---

	function buildCombinedTilesData ( mineCity, millCity ) {

		const data = new Float32Array( COMBINED_W * COMBINED_H ).fill( TILE_GROUND );

		function stamp ( city, offsetX ) {
			for ( const lot of city.lots ) {
				const wx = lot.x + offsetX, wy = lot.y;
				const n = wx + wy * COMBINED_W;
				if ( lot.terrain === TerrainType.WATER ) data[ n ] = TILE_WATER;
				else if ( lot.terrain === TerrainType.FOREST ) data[ n ] = treeVariant( lot.x, lot.y );
				else data[ n ] = TILE_GROUND;
			}
		}

		stamp( mineCity, 0 );
		stamp( millCity, CITY_SIZE + GAP );

		return data;

	}

	function placeBuildings ( city, offsetX ) {

		let count = 0;
		for ( const lot of city.lots ) {
			if ( ! lot.isDeveloped || lot.facility === null ) continue; // only anchor lots
			const toolId = TOOL_ID[ lot.zoneType ];
			if ( toolId === undefined ) continue;
			AppState.view3d.selectTool( toolId );
			AppState.view3d.build( lot.x + offsetX, lot.y );
			count ++;
		}
		return count;

	}

	// --- Vehicle layer: real InstancedMesh in the real scene, one mesh per
	// ModelVariant instead of a single shared box. A tinted box proved the
	// InstancedMesh mechanism; this proves the actual visual gap it left
	// open - HOPPER/TANKER/FLATBED/REFRIGERATED/VAN/TRANSIT cargo now has a
	// genuinely different silhouette, not just a different color, matching
	// what Tier 6's README always meant by "model variant" but the first
	// port didn't yet render. Geometry is simple primitives (no ripped
	// assets, nothing GPL-adjacent) chosen to read distinctly at a glance:
	// a tapered hexagonal hopper car, a horizontal tanker cylinder, a low
	// flatbed, a boxy refrigerated container, a compact van, and a longer
	// transit bus shape.

	const VEHICLE_CAPACITY_PER_VARIANT = 40;

	function buildVehicleGeometry ( variant ) {

		switch ( variant ) {

			case ModelVariant.HOPPER: return new THREE.CylinderGeometry( 0.6, 0.35, 1.0, 6 );
			case ModelVariant.TANKER: return new THREE.CylinderGeometry( 0.45, 0.45, 1.6, 12 ).rotateZ( Math.PI / 2 );
			case ModelVariant.FLATBED: return new THREE.BoxGeometry( 1.8, 0.35, 0.9 );
			case ModelVariant.REFRIGERATED: return new THREE.BoxGeometry( 1.3, 1.05, 0.9 );
			case ModelVariant.VAN: return new THREE.BoxGeometry( 0.95, 0.85, 0.8 );
			case ModelVariant.TRANSIT: return new THREE.BoxGeometry( 1.6, 0.95, 0.85 );
			default: return new THREE.BoxGeometry( 1.2, 1.2, 1.2 ); // unknown future variant - still renders

		}

	}

	// One InstancedMesh per variant (all sharing one vertex-colored
	// material) rather than one mesh per resource, so cargo sharing a
	// variant still batches - the same GPU-instancing rationale
	// CargoVisual.js documents, just now expressed as real geometry too.
	function buildVehicleMeshes () {

		const material = new THREE.MeshStandardMaterial( { vertexColors: true } );
		const meshes = new Map();

		for ( const variant of Object.values( ModelVariant ) ) {

			const mesh = new THREE.InstancedMesh( buildVehicleGeometry( variant ), material, VEHICLE_CAPACITY_PER_VARIANT );
			AppState.view3d.scene.add( mesh );
			meshes.set( variant, mesh );

		}

		return meshes;

	}

	let vehicleMeshes, cargoRegistry, region, mineCity, millCity, orchestrator, resolver;
	let millLot = null; // set once a clear spot is found, after fillCity runs
	const dummy = new THREE.Object3D();
	const hiddenMatrix = new THREE.Matrix4().makeScale( 0, 0, 0 );

	function worldAnchor ( city, offsetX ) {
		return { x: offsetX + city.width / 2, z: city.height / 2 };
	}

	function updateVehicleInstances () {

		const mineAnchor = worldAnchor( mineCity, 0 );
		const millAnchor = worldAnchor( millCity, CITY_SIZE + GAP );

		const used = new Map();
		for ( const variant of vehicleMeshes.keys() ) used.set( variant, 0 );

		for ( const shipment of region.shipments.values() ) {

			if ( shipment.state !== ShipmentState.IN_TRANSIT ) continue;
			if ( shipment.path.length === 0 ) continue; // intra-city moves aren't spatial here

			const visual = visualForShipment( shipment, cargoRegistry, region.resources );
			const variant = visual ? visual.modelVariant : ModelVariant.FLATBED;
			const mesh = vehicleMeshes.get( variant );
			const i = used.get( variant );
			if ( ! mesh || i >= VEHICLE_CAPACITY_PER_VARIANT ) continue; // over this variant's per-mesh budget - still simulated, just not rendered

			// Only one corridor exists (mine <-> mill), so progress maps
			// directly onto the mine-anchor -> mill-anchor segment; a
			// multi-hop region would need the same segment-walk as
			// dev_engine_region_3d.html's shipmentPosition().
			const originIsMine = mineCity.facilities.has( shipment.originFacilityId );
			const a = originIsMine ? mineAnchor : millAnchor;
			const b = originIsMine ? millAnchor : mineAnchor;
			const t = shipment.progress;

			dummy.position.set( a.x + ( b.x - a.x ) * t, 1, a.z + ( b.z - a.z ) * t );
			dummy.rotation.y = Math.atan2( b.x - a.x, b.z - a.z ); // face direction of travel
			dummy.scale.set( 1, 1, 1 );
			dummy.updateMatrix();
			mesh.setMatrixAt( i, dummy.matrix );
			mesh.setColorAt( i, visual ? hexToThreeColor( visual.tint ) : new THREE.Color( 0xffffff ) );

			used.set( variant, i + 1 );

		}

		let rendered = 0;
		const byVariant = {};
		for ( const [ variant, mesh ] of vehicleMeshes ) {

			const count = used.get( variant );
			for ( let j = count; j < VEHICLE_CAPACITY_PER_VARIANT; j ++ ) mesh.setMatrixAt( j, hiddenMatrix );
			mesh.instanceMatrix.needsUpdate = true;
			if ( mesh.instanceColor ) mesh.instanceColor.needsUpdate = true;
			byVariant[ variant ] = count;
			rendered += count;

		}

		return { rendered, byVariant };

	}

	function tickSimulation () {

		orchestrator.tick();

		if ( millLot && millLot.facility === null ) {
			const recipe = resolver.resolve( millCity, millLot, availableResourceIds( region ) );
			if ( recipe ) developLot( millCity, millLot, recipe );
		}

		const { rendered, byVariant } = updateVehicleInstances();

		const all = Array.from( region.shipments.values() );
		const summary = {
			tick: region.tick,
			mineFacilities: mineCity.facilities.size,
			millFacilities: millCity.facilities.size,
			millSteelMillResolved: millLot !== null && millLot.facility !== null,
			shipmentsCreated: all.length,
			shipmentsInTransit: all.filter( s => s.state === ShipmentState.IN_TRANSIT ).length,
			shipmentsDelivered: all.filter( s => s.state === ShipmentState.DELIVERED ).length,
			renderedVehicleInstances: rendered,
			renderedByVariant: byVariant,
		};
		document.getElementById( 'status' ).textContent = JSON.stringify( summary );
		window.__engineView3DVehiclesReady = summary;
		// Exposed for automated verification of the actual instance
		// buffers against real engine state, not just a summary count.
		window.__engineView3DVehiclesDebug = { region, mineCity, millCity, vehicleMeshes, cargoRegistry, CITY_SIZE, GAP };

	}

	async function run () {

		try {

			status( 'building simulation (mine city -> mill city)...' );
			( { region, mineCity, millCity, resolver, orchestrator } = buildSimulation() );

			const zoneCycle = [ ZoneType.RESIDENTIAL, ZoneType.COMMERCIAL, ZoneType.INDUSTRIAL ];
			fillCity( mineCity, region, resolver, zoneCycle );
			fillCity( millCity, region, resolver, zoneCycle );

			// Pick the steel_mill test lot only after fillCity has claimed
			// its dense grid, so it's a genuinely clear spot, not a guess.
			millLot = findClearIndustrialSpot( millCity );
			if ( millLot ) millLot.zoneType = ZoneType.INDUSTRIAL;

			const tilesData = buildCombinedTilesData( mineCity, millCity );

			status( 'constructing real View/Hub (no Worker, no CityGame.js)...' );
			AppState.hub = new Hub();
			AppState.view3d = new View();
			AppState.main = { start () {}, sendTool () {} };

			status( 'initRenderer()...' );
			await AppState.view3d.initRenderer();

			status( 'paintMap() on the combined two-city grid...' );
			AppState.tilesData = tilesData;
			AppState.view3d.paintMap( [ COMBINED_W, COMBINED_H ], false );
			AppState.view3d.clearIntro();
			AppState.hub.start();

			status( 'placing real buildings in both cities...' );
			const mineBuilt = placeBuildings( mineCity, 0 );
			const millBuilt = placeBuildings( millCity, CITY_SIZE + GAP );

			status( 'adding real per-variant InstancedMesh vehicle layers to view3d.scene...' );
			cargoRegistry = createDefaultCargoVisualRegistry();
			vehicleMeshes = buildVehicleMeshes();

			AppState.view3d.center.x = COMBINED_W / 2;
			AppState.view3d.center.z = COMBINED_H / 2;
			AppState.view3d.cam.distance = 140;
			AppState.view3d.moveCamera();

			status( `running simulation ticks (mine built ${mineBuilt}, mill built ${millBuilt})...` );
			setInterval( tickSimulation, 200 );
			tickSimulation();

		} catch ( err ) {

			status( 'ERROR: ' + err.message );
			window.__engineView3DVehiclesReady = { ok: false, error: err.message, stack: err.stack };
			console.error( err );

		}

	}

	run();

</script>

<div id="container"></div>
<div id="hub"></div>
<div id="status">starting...</div>

</body></html>
