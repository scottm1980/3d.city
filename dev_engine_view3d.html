<!DOCTYPE html>
<html lang="en">
<head>
<title>engine real-renderer preview</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
<link rel="icon" href="favicon.ico" />
<link type="text/css" rel="stylesheet" href="index.css">
</head>
<style>
#status { position:absolute; left:10px; top:10px; z-index:10; font:12px monospace; background:rgba(0,0,0,0.6); color:#fff; padding:6px 10px; }
</style>
<script type="module">
	// Fifth dev preview - the first to drive the game's REAL rendering
	// code (src/city3d/View.js, Hub.js) instead of a hand-rolled canvas
	// or a standalone Three.js scene. Deliberately does NOT call
	// Main.init() or Main.initWorker(): no Worker is ever booted, GPL
	// CityGame.js is never loaded or executed. Only View/Hub/AppState are
	// constructed directly, and AppState.tilesData is fed from
	// src/engine's CityMapGenerator through a small tile-value adapter
	// instead of from a WorkerBridge RUN/NEWMAP message.
	//
	// Tile-value mapping is intentionally minimal for this first pass -
	// water vs. plain ground only, using Tile.js's own documented
	// constants (RIVER=2 for plain water, DIRT=0 for plain ground) so the
	// values are correct per the renderer's actual contract, not guessed.
	// No shoreline blending, no trees, no buildings yet.
	import { View } from './src/city3d/View.js';
	import { Hub } from './src/city3d/Hub.js';
	import { AppState } from './src/AppState.js';

	import { CityState, ControlMode } from './src/engine/world/CityState.js';
	import { CityMapGenerator } from './src/engine/worldgen/CityMapGenerator.js';
	import { TerrainType } from './src/engine/worldgen/Terrain.js';

	const TILE_WATER = 2;  // Tile.RIVER - plain water, no shoreline blend
	const TILE_GROUND = 0; // Tile.DIRT - plain ground, no biome texture yet

	function status ( text ) {
		document.getElementById( 'status' ).textContent = text;
	}

	function buildTilesData ( city ) {

		const data = new Float32Array( city.width * city.height );

		for ( const lot of city.lots ) {

			const n = lot.x + lot.y * city.width; // square map, so this matches View's x + y*mapSize[1] convention
			data[ n ] = lot.terrain === TerrainType.WATER ? TILE_WATER : TILE_GROUND;

		}

		return data;

	}

	async function run () {

		try {

			status( 'generating city...' );
			const size = 96;
			const city = new CityState( 'preview', 'Preview', { width: size, height: size, controlMode: ControlMode.MANAGED } );
			new CityMapGenerator( 1 ).generate( city );

			const tilesData = buildTilesData( city );
			let waterCount = 0;
			for ( let i = 0; i < tilesData.length; i ++ ) if ( tilesData[ i ] === TILE_WATER ) waterCount ++;

			status( 'constructing real View/Hub (no Worker, no CityGame.js)...' );
			AppState.hub = new Hub();
			AppState.view3d = new View();
			// initRenderer() calls AppState.main.start() at the end,
			// assuming Main.init() already ran (it sets AppState.main).
			// Deliberately not calling Main.init() here since it would
			// boot a real Worker and load GPL CityGame.js - stub the one
			// method actually needed instead.
			AppState.main = { start () {} };

			status( 'initRenderer() - loading real game assets, may take a moment...' );
			await AppState.view3d.initRenderer();

			status( 'paintMap() with src/engine-generated tilesData...' );
			AppState.tilesData = tilesData;
			AppState.view3d.paintMap( [ size, size ], false );

			// Dismiss the real game's title/menu overlay (normally cleared
			// by clicking NEW GAME through the Hub flow this harness
			// skips) purely so the rendered terrain is actually visible
			// for verification, not obstructed by the intro screen.
			AppState.view3d.clearIntro();

			status( 'done' );
			window.__engineView3DReady = {
				ok: true,
				size,
				waterCount,
				groundCount: tilesData.length - waterCount,
				isWebGPU: AppState.isWebGPU,
			};

		} catch ( err ) {

			status( 'ERROR: ' + err.message );
			window.__engineView3DReady = { ok: false, error: err.message, stack: err.stack };
			console.error( err );

		}

	}

	run();

</script>

<div id="container"></div>
<div id="hub"></div>
<div id="status">starting...</div>

</body></html>
