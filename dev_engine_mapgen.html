<!DOCTYPE html>
<html lang="en">
<head>
<title>engine map preview</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
<link rel="icon" href="favicon.ico" />
</head>
<style>
*{ padding:0; margin: 0; -o-user-select:none; -ms-user-select:none; -khtml-user-select:none; -webkit-user-select:none; -moz-user-select: none;}
html { width:100%; height:100%; }
body { background:#8397ac; font:10px sans-serif; width:100%; height:100%; color:#FFFFFF; overflow: hidden; }

#debug{ }
#hub{ position:absolute; top:0; left:0; height:100%; width:100%; pointer-events:none; display:block; text-align:center;}

</style>
<script type="module">
	// Preview harness for src/engine's world generator, mirroring
	// dev_mapgen.html's pattern (isolated canvas preview, no CityGame.js /
	// WorkerBridge.js / GPL src/micro involved at all). Colors lots by
	// TerrainType and overlays resource endowment so belts/clustering are
	// visible - this is the first real, browser-verifiable proof that
	// src/engine's Tier 2 generator produces sane, renderable output.
	// Plain HTML controls rather than build/uil.module.js, which is a
	// gitignored local build artifact not present in a fresh checkout.
	import { CityState, ControlMode } from './src/engine/world/CityState.js';
	import { CityMapGenerator } from './src/engine/worldgen/CityMapGenerator.js';
	import { TerrainType } from './src/engine/worldgen/Terrain.js';

	let canvas = null;

	const MAP_SIZES = {
	    SMALL:  [64,  64],
	    MEDIUM: [128, 128],
	    LARGE:  [192, 192],
	};

	const TERRAIN_COLOR = {
	    [TerrainType.WATER]:    [ 58, 102, 158 ],
	    [TerrainType.PLAINS]:   [ 150, 189, 96 ],
	    [TerrainType.FOREST]:   [ 60, 110, 60 ],
	    [TerrainType.HILLS]:    [ 150, 129, 90 ],
	    [TerrainType.MOUNTAIN]: [ 120, 120, 128 ],
	    [TerrainType.DESERT]:   [ 214, 196, 135 ],
	};

	// A distinct bright tint per resource, so different belts read apart
	// from each other rather than all looking like "resource here".
	const RESOURCE_COLOR = {
	    iron_ore: [ 214, 80, 60 ],
	    coal:     [ 30, 30, 30 ],
	    timber:   [ 101, 67, 33 ],
	    grain:    [ 235, 209, 60 ],
	    fish:     [ 40, 200, 220 ],
	    oil:      [ 10, 10, 10 ],
	};

	const setting = {
		size: 'MEDIUM',
		seed: 1,
	};

	function gen () {

		setting.size = document.getElementById( 'size' ).value;
		setting.seed = parseInt( document.getElementById( 'seed' ).value, 10 ) || 1;

		const size = MAP_SIZES[ setting.size ];
		const city = new CityState( 'preview', 'Preview', { width: size[0], height: size[1], controlMode: ControlMode.MANAGED } );

		new CityMapGenerator( setting.seed ).generate( city );

		makePreview( city );

	}

	function makePreview ( city ) {

		if ( canvas ) document.body.removeChild( canvas );

		const w = city.width;
		const h = city.height;

		canvas = document.createElement( 'canvas' );
		canvas.width = w;
		canvas.height = h;
		canvas.style.cssText = 'position:absolute; left:10px; top:10px; transform: scale(6); image-rendering: pixelated;';

		const ctx = canvas.getContext( '2d' );
		const imageData = ctx.getImageData( 0, 0, w, h );
		const data = imageData.data;

		let resourceCount = 0;
		const terrainCounts = {};

		for ( const lot of city.lots ) {

			const n = ( lot.y * w + lot.x ) * 4;
			let [ r, g, b ] = TERRAIN_COLOR[ lot.terrain ] || [ 255, 0, 255 ];

			terrainCounts[ lot.terrain ] = ( terrainCounts[ lot.terrain ] || 0 ) + 1;

			if ( lot.hasResource ) {

				resourceCount ++;
				const tint = RESOURCE_COLOR[ lot.resourceEndowment.resourceId ] || [ 255, 0, 255 ];
				const mix = 0.35 + lot.resourceEndowment.richness * 0.5; // richer deposits read more saturated

				r = r * ( 1 - mix ) + tint[0] * mix;
				g = g * ( 1 - mix ) + tint[1] * mix;
				b = b * ( 1 - mix ) + tint[2] * mix;

			}

			data[ n ]     = r;
			data[ n + 1 ] = g;
			data[ n + 2 ] = b;
			data[ n + 3 ] = 255;

		}

		ctx.putImageData( imageData, 0, 0 );
		document.body.appendChild( canvas );

		const debug = document.getElementById( 'debug' );
		debug.textContent = 'seed ' + setting.seed + ' | ' + w + 'x' + h + ' | resource lots: ' + resourceCount + ' | terrain: ' + JSON.stringify( terrainCounts );

		// Signal for automated verification (e.g. a Playwright check) that
		// generation actually completed and produced non-trivial output.
		window.__enginePreviewReady = { seed: setting.seed, width: w, height: h, resourceCount, terrainCounts };

	}

	document.getElementById( 'generate' ).addEventListener( 'click', gen );
	gen();

</script>

<div id="container"></div>
<div id="hub"></div>
<div style="position:absolute; left:10px; top:10px; z-index:1; background:rgba(0,0,0,0.6); padding:8px; font:12px monospace;">
	<div>engine map preview</div>
	<label>size
		<select id="size">
			<option value="SMALL">SMALL</option>
			<option value="MEDIUM" selected>MEDIUM</option>
			<option value="LARGE">LARGE</option>
		</select>
	</label>
	<label>seed <input id="seed" type="number" value="1" min="1" max="9999" style="width:60px;"></label>
	<button id="generate">GENERATE</button>
</div>
<div id="debug" style="position:absolute; left:10px; bottom:10px; font:12px monospace; background:rgba(0,0,0,0.5); padding:4px 8px;"></div>

</body></html>
